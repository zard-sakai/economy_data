name: Cross Market Data Collector

'on':
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行数据采集脚本
        run: python collect.py

      - name: 自动提交并推送更新的数据到 GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: 更新跨市场资金行为数据 [skip ci]"
          file_pattern: "cross_market_data/*"

name: Global Fund Flow Fetcher

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击 Run workflow
  schedule:
    - cron: '0 8 * * *' # 每天 UTC 08:00 (北京时间 16:00) 自动执行

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests akshare yfinance

      - name: Run Fund Flow Script
        run: python fetch_flows.py

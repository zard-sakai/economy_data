name: 采集资本流动数据

on:
  schedule:
    # 美股收盘后（UTC 22:10 ≈ 美东 17:10 冬令时 / 18:10 夏令时）
    - cron: "10 22 * * 1-5"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write          # ← 新增：否则 GITHUB_TOKEN 只读，提交必失败

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # ← 改：与 requirements.txt 保持一致

      - name: 采集数据
        run: python fetch_flows.py --out fund_flow_data.json   # ← 核心修正

      - name: 校验产物非空
        run: |
          python - <<'PY'
          import json, sys
          with open("fund_flow_data.json", encoding="utf-8") as f:
              d = json.load(f)
          b1 = d.get("board_1_macro_assets_7d", {}).get("data", {})
          good = [k for k, v in b1.items() if v]
          print("board1 有效资产:", good)
          print("data_quality:", d.get("board_1_macro_assets_7d", {}).get("data_quality"))
          if not good:
              sys.exit("❌ 所有资产均无数据，终止")
          PY

      - name: 提交产物
        uses: stefanzweifel/git-auto-commit-action@v5   # ← 改：与 daily_collect.yml 风格统一
        with:
          commit_message: "Auto: 更新资本流动数据 [skip ci]"
          file_pattern: "fund_flow_data.json"

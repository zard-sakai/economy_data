name: Global Fund Flow Fetcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests akshare yfinance

      - name: Run Fund Flow Script
        run: python fetch_flows.py

      # 新增步骤：上传生成的数据文件
      - name: Upload Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fund-flow-daily-data
          path: fund_flow_data.json
          retention-days: 7 # 文件保留 7 天

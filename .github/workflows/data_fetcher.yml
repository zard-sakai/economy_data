name: Global Fund Flow Fetcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    # 需要赋予 Actions 写代码仓库的权限
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests akshare yfinance

      - name: Run Fund Flow Script
        run: python fetch_flows.py

      # 新增步骤：将生成的文件直接提交（Commit & Push）到当前代码库
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add fund_flow_data.json
          git commit -m "自动更新每日资金流向数据" || echo "今天的数据没有变化"
          git push
